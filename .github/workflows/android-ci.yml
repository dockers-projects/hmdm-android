name: Android CI

on:
  pull_request:
    branches:
      - master
      - feature/launcher-folders
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Unit tests, lint, APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Show runner environment
        run: |
          echo "runner: $(uname -a)"
          docker version

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Docker daemon
        run: docker info >/dev/null

      - name: Build Android CI image
        run: |
          docker build \
            --pull \
            -f ci/android/Dockerfile \
            -t "hmdm-android-ci:${GITHUB_SHA}" \
            ci/android

      - name: Run quality gates
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e CI=true \
            -e HOME=/tmp/home \
            -e GRADLE_USER_HOME=/tmp/gradle-home \
            -v "${PWD}:/workspace" \
            -w /workspace \
            "hmdm-android-ci:${GITHUB_SHA}" \
            bash ci/run-checks.sh

      - name: Smoke-build launcher-bundled server image
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp app/build/outputs/apk/opensource/debug/app-opensource-debug.apk dist/launcher.apk
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle | head -n1)"
          docker build \
            --pull \
            --build-arg "HMDM_BASE_IMAGE=headwindmdm/hmdm:0.1.9" \
            --build-arg "CLIENT_VERSION=${VERSION_NAME}" \
            --build-arg "VCS_REF=${GITHUB_SHA}" \
            -f ci/server-image/Dockerfile \
            -t "hmdm-server-ci:${GITHUB_SHA}" \
            .
          docker run --rm --entrypoint sh "hmdm-server-ci:${GITHUB_SHA}" -c \
            'test -s /opt/hmdm/bundled-launcher/launcher.apk'
          rm -rf dist

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports-${{ github.sha }}
          path: |
            app/build/reports/lint-results-*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hmdm-opensource-debug-${{ github.sha }}
          path: app/build/outputs/apk/opensource/debug/app-opensource-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup CI images
        if: always()
        run: |
          docker image rm -f "hmdm-android-ci:${GITHUB_SHA}" || true
          docker image rm -f "hmdm-server-ci:${GITHUB_SHA}" || true
